<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speaking Practice</title>
<style>
  :root { --ink:#2b2622; --sub:#6b6058; --bg:#faf6f0; --card:#fff; --accent:#7a2e2e; --blue:#4f7489; --ok:#2e7d4f; --rec:#c0392b; --line:#e6ddd2; --tint:#f6ebe3; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --ink:#f3ece6; --sub:#b3a69c; --bg:#1c1816; --card:#262120; --accent:#e08a7a; --blue:#8fb6cc; --ok:#6fcf97; --rec:#ff7b6b; --line:#3a3230; --tint:#3a2724; } }
  :root[data-theme="dark"]{ --ink:#f3ece6; --sub:#b3a69c; --bg:#1c1816; --card:#262120; --accent:#e08a7a; --blue:#8fb6cc; --ok:#6fcf97; --rec:#ff7b6b; --line:#3a3230; --tint:#3a2724; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Hiragino Sans","Yu Gothic UI","Meiryo","Noto Sans JP",sans-serif; line-height:1.6; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 16px; }
  .bar { max-width:640px; margin:0 auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .bar b { color:var(--accent); }
  .bar .sp { flex:1; }
  .tool { font-family:inherit; font-size:.9rem; padding:4px 10px; border-radius:18px; border:2px solid var(--blue); background:var(--card); color:var(--blue); cursor:pointer; }
  .tool.on { background:var(--blue); color:#fff; }
  .stars { max-width:640px; margin:6px auto 0; display:flex; gap:4px; justify-content:center; font-size:1.2rem; letter-spacing:.05em; flex-wrap:wrap; }
  .stars span { opacity:.25; } .stars span.done { opacity:1; }
  main { max-width:640px; margin:0 auto; padding:18px 16px 60px; }
  .card { background:var(--card); border-radius:16px; padding:20px 18px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .step { color:var(--sub); font-size:.95rem; margin:0; text-align:center; }
  h2 { text-align:center; margin:2px 0 14px; font-size:1.3rem; }
  .lines { margin:0 0 6px; }
  .ln { padding:8px 10px; border-radius:12px; margin:6px 0; }
  .ln.new { background:var(--tint); }
  .ln.turn { outline:3px solid var(--rec); }
  .ln .cue { color:var(--blue); font-size:.95rem; }
  .ln .jp { font-size:clamp(1.35rem,5.5vw,1.8rem); line-height:1.45; }
  .ln .ro { color:var(--blue); font-family:Arial,sans-serif; font-size:1rem; }
  .ln .en { color:var(--sub); font-size:.95rem; }
  .ln .blank { font-size:1.5rem; color:var(--line); letter-spacing:.3em; }
  .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:14px; }
  .btn { font-family:inherit; font-size:1.05rem; padding:10px 16px; border-radius:24px; border:2px solid var(--blue); background:var(--card); color:var(--blue); cursor:pointer; text-decoration:none; }
  .btn:disabled { opacity:.4; cursor:default; }
  .btn.main { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.rec { border-color:var(--rec); color:var(--rec); font-size:1.15rem; padding:12px 22px; }
  .btn.rec.on { background:var(--rec); color:#fff; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.7; } }
  .msg { text-align:center; color:var(--sub); margin:10px 0 0; min-height:1.4em; }
  .msg.good { color:var(--ok); font-weight:bold; }
  .intro p, .intro li { margin:6px 0; }
  .big { font-size:2rem; text-align:center; margin:6px 0; }
  .warn { background:var(--tint); border-radius:12px; padding:10px 12px; font-size:.95rem; }
  .slot { display:inline-block; border:2px dashed var(--blue); border-radius:8px; padding:0 8px; margin:0 2px; color:var(--blue); font-family:Arial,sans-serif; font-size:.8em; line-height:1.4; }
  .about { background:var(--tint); border-radius:12px; padding:10px 12px; margin-top:12px; }
  .field { display:flex; flex-direction:column; gap:2px; margin:8px 0; font-size:.95rem; color:var(--sub); }
  .field input, .field select { font-family:inherit; font-size:1.1rem; padding:8px 10px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--ink); }
</style>
</head>
<body>
<header>
  <div class="bar"><b>🎤 Speaking practice</b><span class="sp"></span><button class="tool" id="roBtn">abc Romaji</button><button class="tool" id="slowBtn">🐢 Slow</button><button class="tool" id="restart">↺ Start</button></div>
  <div class="stars" id="stars"></div>
</header>
<main><div class="card" id="card"></div></main>

<script>
// ===== The drill content. make_drill.py replaces everything between the two markers. =====
const DRILL = /*DRILL*/{
  "title": "じこしょうかい",
  "titleEn": "Self-introduction",
  "goal": "your self-introduction",
  "romajiTimes": 2,
  "slots": {
    "Name": {
      "en": "your name",
      "example": "エマ"
    },
    "Country": {
      "en": "your country",
      "choices": [
        {
          "jp": "ニュージーランド",
          "ro": "nyūjīrando",
          "en": "New Zealand"
        },
        {
          "jp": "オーストラリア",
          "ro": "ōsutoraria",
          "en": "Australia"
        },
        {
          "jp": "アメリカ",
          "ro": "amerika",
          "en": "the USA"
        },
        {
          "jp": "イギリス",
          "ro": "igirisu",
          "en": "the UK"
        }
      ]
    }
  },
  "lines": [
    {
      "cue": "おなまえは なんですか。",
      "cueRo": "onamae wa nan desu ka.",
      "jp": "はじめまして。わたしは {Name}です。",
      "ro": "hajimemashite. watashi wa {Name} desu.",
      "en": "Nice to meet you. I'm {Name}."
    },
    {
      "cue": "なにじんですか。",
      "cueRo": "nanijin desu ka.",
      "jp": "{Country}じんです。",
      "ro": "{Country}-jin desu.",
      "en": "I'm a person from {Country}."
    },
    {
      "cue": "どこから きましたか。",
      "cueRo": "doko kara kimashita ka.",
      "jp": "{Country}から きました。",
      "ro": "{Country} kara kimashita.",
      "en": "I came from {Country}."
    },
    {
      "jp": "どうぞ よろしく。",
      "ro": "dōzo yoroshiku.",
      "en": "Pleased to meet you."
    }
  ]
}/*END*/;

const $ = s => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const L = DRILL.lines;

// ---------- blanks the student fills in: {Name}, {Country} ... ----------
const SLOTS = DRILL.slots || {};
const SLOT_RE = /\{([A-Za-z0-9_]+)\}/g;
const slotKey = 'drill-slots-' + (DRILL.titleEn || DRILL.title || '');
let vals = {}; try { vals = JSON.parse(store.get(slotKey) || '{}') || {}; } catch(e){ vals = {}; }
const isKana = s => /^[぀-ヿ一-鿿ー\s・]+$/.test(s);
// the value of a blank for one kind of text: 'jp' | 'ro' | 'en' | 'say' (null = leave the blank)
function slotValue(name, kind){
  const v = vals[name], sl = SLOTS[name] || {};
  // the voice reads an example word for an empty blank, so the sentence sounds whole
  const example = sl.example || (sl.choices && sl.choices[0] && sl.choices[0].jp) || null;
  if(!v) return kind === 'say' ? example : null;
  if(sl.choices){ const c = sl.choices[+v]; if(!c) return kind === 'say' ? example : null; return kind === 'say' ? c.jp : (c[kind] || c.jp); }
  if(kind === 'say') return isKana(v) ? v : example;  // a Japanese voice can't read a name typed in English letters
  return v;
}
// text with blanks → safe HTML
function fillHTML(str, kind){
  return esc(str).replace(SLOT_RE, (m, name) => {
    const v = slotValue(name, kind);
    if(v) return `<b>${esc(v)}</b>`;
    if(kind === 'en') return `<i>(${esc((SLOTS[name] || {}).en || name)})</i>`;
    return `<span class="slot">${esc(name)}</span>`;
  });
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const HAS_RO = L.some(l => l.ro);
const RO_UNTIL = DRILL.romajiTimes == null ? 2 : DRILL.romajiTimes;  // 0 = romaji every time
document.title = DRILL.titleEn ? 'Speaking Practice · ' + DRILL.titleEn : 'Speaking Practice';

// ---------- voice: the phone's own Japanese voice ----------
let slow = store.get('drill-slow') === '1', playId = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
const synth = window.speechSynthesis;
let jaVoices = [];
function loadVoices(){
  if(!synth) return;
  jaVoices = synth.getVoices().filter(v => /^ja/i.test(v.lang));
  // Natural / online voices sound better: put them first
  const score = v => (/natural|online|enhanced|premium|google|siri/i.test(v.name) ? 0 : 1);
  jaVoices.sort((a, b) => score(a) - score(b));
}
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
const MALE = /otoya|ichiro|keita|hattori|daichi|naoki/i;
const badVoices = new Set();  // voices that failed on this device are skipped
function voiceFor(who){
  const ok = jaVoices.filter(v => !badVoices.has(v.name));
  if(!ok.length) return null;
  if(who === 'q'){ const m = ok.find(v => MALE.test(v.name)); if(m) return m; }
  if(who === 'a'){ const f = ok.find(v => !MALE.test(v.name)); if(f) return f; }
  return ok[0];
}
function speakOnce(text, who){
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    const v = voiceFor(who); if(v) u.voice = v;
    const sameVoice = v && voiceFor('q') === voiceFor('a');
    u.pitch = sameVoice ? (who === 'q' ? 0.8 : 1.15) : 1;
    u.rate = slow ? 0.6 : 0.85;
    let done = false; const end = r => { if(!done){ done = true; res(r); } };
    u.onend = () => end('ok');
    u.onerror = e => end(/interrupted|canceled/.test(e.error) ? 'stopped' : { failed:v });
    setTimeout(() => end('ok'), 3000 + text.length * (slow ? 450 : 300));  // in case the browser never says "ended"
    synth.speak(u);
  });
}
// a sentence with blanks: say the filled parts, and leave a short gap where the student says their own word
async function speak(text, who){
  if(!synth) return;
  const parts = String(text).split(SLOT_RE);  // even = text, odd = blank name
  let buf = '';
  for(let i = 0; i < parts.length; i++){
    if(i % 2 === 0){ buf += parts[i]; continue; }
    const v = slotValue(parts[i], 'say');
    if(v){ buf += v; continue; }
    if(buf.trim()) await speakPart(buf, who);
    buf = '';
    await wait(slow ? 1400 : 1000);
  }
  if(buf.trim()) await speakPart(buf, who);
}
async function speakPart(text, who){
  for(let tries = 0; tries < 3; tries++){
    const r = await speakOnce(text, who);
    if(!r || !r.failed) return;
    badVoices.add(r.failed.name);  // try the next voice
  }
}
function stopAll(){ playId++; if(synth) synth.cancel(); if(curAudio){ curAudio.pause(); curAudio = null; } }
let curAudio = null;
async function play(items){
  stopAll(); const id = playId;
  for(const [text, who] of items){ if(id !== playId) return; await speak(text, who); await wait(350); }
}

let showRo = HAS_RO && store.get('drill-ro') !== '0';
if(!HAS_RO) $('#roBtn').hidden = true;
$('#roBtn').classList.toggle('on', showRo);
$('#roBtn').onclick = () => { showRo = !showRo; store.set('drill-ro', showRo ? '1' : '0'); $('#roBtn').classList.toggle('on', showRo); if(!talking) render(); };
$('#slowBtn').classList.toggle('on', slow);
$('#slowBtn').onclick = () => { slow = !slow; store.set('drill-slow', slow ? '1' : '0'); $('#slowBtn').classList.toggle('on', slow); };

// ---------- steps: learn 1, learn 2, together 1-2, learn 3, together 1-3, ... , final (all, no looking) ----------
const STEPS = [];
L.forEach((_, k) => { STEPS.push({ kind:'learn', k }); if(k > 0) STEPS.push({ kind:'together', n:k + 1 }); });
STEPS.push({ kind:'final' });
const STEP_COUNT = STEPS.length;
let at = -1, recs = {}, peek = false, finalRec = null;

// ---------- recording: the microphone hears the question from the speaker and the student's answer ----------
let stream = null, mediaRec = null, chunks = [], talking = false, turnDone = null;
function pickMime(){
  if(!window.MediaRecorder) return null;
  for(const m of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']) if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
async function setupRec(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || pickMime() === null){ msg('Recording does not work here. Try Chrome or Safari on your phone.'); return false; }
  // open the microphone fresh for every recording: on phones, the speaking voice or playing a recording can stop a microphone that was opened earlier
  closeMic();
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:true } }); }
  catch(e){ msg('Please allow the microphone, then press 🎤 again.'); return false; }
  return true;
}
function closeMic(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
async function talk(lines, onDone){
  stopAll();
  if(!await setupRec()) return;
  const mime = pickMime(); chunks = [];
  mediaRec = mime ? new MediaRecorder(stream, { mimeType:mime }) : new MediaRecorder(stream);
  mediaRec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  const stopped = new Promise(r => mediaRec.onstop = r);
  mediaRec.start(); talking = true; setTalkUI(true);
  const lns = [...document.querySelectorAll('.lines .ln')];
  for(let i = 0; i < lines.length && talking; i++){
    lns.forEach((el, j) => el.classList.toggle('turn', j === i));
    if(lines[i].cue){ msg('Listen…'); await wait(250); await speak(lines[i].cue, 'q'); }
    if(!talking) break;
    msg('🎤 Your turn! Say it, then press ✓.');
    $('#turn').disabled = false; $('#turn').textContent = i === lines.length - 1 ? '✓ Done' : '✓ Next';
    await new Promise(r => turnDone = r);
    $('#turn').disabled = true;
  }
  await wait(400);
  const finished = talking; talking = false;
  if(mediaRec.state === 'recording') mediaRec.stop();
  await stopped;
  closeMic();
  lns.forEach(el => el.classList.remove('turn'));
  setTalkUI(false);
  const blob = new Blob(chunks, { type:mediaRec.mimeType || mime || 'audio/webm' });
  if(finished && blob.size < 2000) msg('The recording didn\'t work. Press 🎤 and try again.');
  else if(finished) onDone(blob);
  else msg('Stopped. Press 🎤 to try again.');
}
function stopTalk(){ talking = false; if(turnDone){ turnDone(); turnDone = null; } }
function setTalkUI(on){
  const rb = $('#rec'); if(!rb) return;
  rb.classList.toggle('on', on); rb.textContent = on ? '⏹ Stop' : '🎤 Start talking';
  $('#turnRow').hidden = !on;
  ['listen', 'mine', 'next', 'back', 'done', 'peek'].forEach(id => { const b = $('#' + id); if(b) b.hidden = on; });
}
function msg(t, good){ const m = $('#msg'); if(m){ m.textContent = t; m.classList.toggle('good', !!good); } }

// ---------- screens ----------
function stars(){
  $('#stars').innerHTML = STEPS.map((s, i) => `<span class="${recs[i] ? 'done' : ''}">${s.kind === 'final' ? '🏆' : '⭐'}</span>`).join('');
}
function lineHTML(l, opts){
  const hide = opts.hide, ro = showRo && opts.ro !== false;
  return `<div class="ln ${opts.isNewHere ? 'new' : ''}">
    ${l.cue ? `<div class="cue">🔊 ${fillHTML(l.cue, 'jp')}${ro && l.cueRo ? ` <span style="font-family:Arial,sans-serif;opacity:.8">(${fillHTML(l.cueRo, 'ro')})</span>` : ''}</div>` : ''}
    ${hide ? `<div class="blank">・・・</div><div class="en">💬 ${fillHTML(l.en, 'en')}</div>` : `<div class="jp">${fillHTML(l.jp, 'jp')}</div>`}
    ${!hide && ro && l.ro ? `<div class="ro">${fillHTML(l.ro, 'ro')}</div>` : ''}
    ${!hide && opts.en && l.en ? `<div class="en">${fillHTML(l.en, 'en')}</div>` : ''}
  </div>`;
}
// the "about you" box on the first screen: one field per blank used in the sentences
function slotsHTML(){
  const used = [...new Set(L.flatMap(l => [l.cue, l.jp, l.ro, l.en].join(' ').match(SLOT_RE) || []).map(m => m.slice(1, -1)))];
  if(!used.length) return '';
  const fields = used.map(name => {
    const sl = SLOTS[name] || {}, label = esc(sl.en ? sl.en.charAt(0).toUpperCase() + sl.en.slice(1) : name);
    if(sl.choices) return `<label class="field"><span>${label}</span><select data-slot="${esc(name)}">
        <option value="">— choose —</option>
        ${sl.choices.map((c, i) => `<option value="${i}" ${String(vals[name]) === String(i) ? 'selected' : ''}>${esc(c.jp)}${c.en ? ' · ' + esc(c.en) : ''}</option>`).join('')}
      </select></label>`;
    return `<label class="field"><span>${label}</span><input data-slot="${esc(name)}" value="${esc(vals[name] || '')}" autocomplete="off" placeholder="${esc(name)}"></label>`;
  }).join('');
  return `<div class="about"><p><b>About you</b> — put in your own words. You can leave a box empty and just say it.</p>${fields}</div>`;
}
function itemsFor(lines){ const out = []; lines.forEach(l => { if(l.cue) out.push([l.cue, 'q']); out.push([l.jp, 'a']); }); return out; }

function render(){
  stars();
  const c = $('#card');
  if(at < 0){
    const noVoice = !synth || !jaVoices.length;
    c.innerHTML = `<div class="intro">
      <h2>${esc(DRILL.title)}${DRILL.titleEn ? ' · ' + esc(DRILL.titleEn) : ''}</h2>
      <p>Learn ${esc(DRILL.goal || 'it')} <b>one sentence at a time</b>. Each time, the sentences add up. At the end you can say it <b>all</b> — and you'll have a recording of it!</p>
      <ol>
        <li>Press <b>🔊 Listen</b>.</li>
        <li>Press <b>🎤 Start talking</b>. Someone asks you a question. Answer out loud, then press <b>✓</b>.</li>
        <li>Press <b>▶ My recording</b> to hear your conversation. Not happy? Do it again!</li>
        <li>Press <b>Next ▶</b>. Too hard? Press <b>◀ Back</b> and practise the step before.</li>
      </ol>
      ${HAS_RO && RO_UNTIL > 0 ? `<p>The romaji helps you the first ${RO_UNTIL === 1 ? 'time' : RO_UNTIL + ' times'}. <b>After that, it goes away</b> — say it on your own!</p>` : ''}
      <p style="color:var(--sub)">Your phone will ask to use the microphone — press <b>Allow</b>. Your recordings stay on your phone.</p>
      ${noVoice ? '<p class="warn">If you can\'t hear the Japanese voice, open this page in Chrome or Safari, and check that your phone\'s volume is up.</p>' : ''}
      ${slotsHTML()}</div>
      <div class="row"><button class="btn main" id="go">Start ▶</button></div>`;
    document.querySelectorAll('[data-slot]').forEach(el => {
      el.oninput = el.onchange = () => { vals[el.dataset.slot] = el.value.trim(); store.set(slotKey, JSON.stringify(vals)); };
    });
    $('#go').onclick = () => go(0);
    return;
  }
  const s = STEPS[at];
  let head, lines, listen, talkLines;
  if(s.kind === 'learn'){
    const l = L[s.k];
    head = `<p class="step">Sentence ${s.k + 1} of ${L.length}</p><h2>${s.k > 0 ? '✨ New sentence' : 'Say this sentence'}</h2>`;
    lines = lineHTML(l, { ro:true, en:true, isNewHere:true });
    listen = itemsFor([l]); talkLines = [l];
  } else if(s.kind === 'together'){
    const ls = L.slice(0, s.n);
    // how many times each sentence has been on screen: its own step (1) + the "together" steps so far
    const seen = i => i === 0 ? s.n : s.n - i + 1;
    const roFor = i => RO_UNTIL === 0 || seen(i) <= RO_UNTIL;
    const noRo = HAS_RO && ls.some((_, i) => !roFor(i));
    head = `<p class="step">Put it together</p><h2>Now say sentences 1 → ${s.n}</h2>${noRo && showRo ? `<p class="step">No romaji for sentences you have already said ${RO_UNTIL === 1 ? 'once' : RO_UNTIL + ' times'}. You can do it! 💪</p>` : ''}`;
    lines = ls.map((l, i) => lineHTML(l, { isNewHere:i === s.n - 1, ro:roFor(i) })).join('');
    listen = itemsFor(ls); talkLines = ls;
  } else {
    head = `<p class="step">Last one! 🏆</p><h2>Say it all <u>without looking</u></h2>`;
    lines = peek ? L.map(l => lineHTML(l, {})).join('') : L.map(l => lineHTML(l, { hide:true })).join('');
    listen = itemsFor(L); talkLines = L;
  }
  const has = !!recs[at];
  c.innerHTML = `${head}<div class="lines">${lines}</div>
    <div class="row">
      <button class="btn" id="listen">🔊 Listen</button>
      ${s.kind === 'final' ? `<button class="btn" id="peek">${peek ? '🙈 Hide' : '👀 Peek'}</button>` : ''}
    </div>
    <div class="row">
      <button class="btn rec" id="rec">🎤 Start talking</button>
      <button class="btn" id="mine" ${has ? '' : 'disabled'}>▶ My recording</button>
    </div>
    <div class="row" id="turnRow" hidden><button class="btn main" id="turn" disabled>✓ Next</button></div>
    <p class="msg" id="msg">${has ? 'Recorded ⭐ — listen, or record again.' : ''}</p>
    <div class="row">
      ${at > 0 ? '<button class="btn" id="back">◀ Back</button>' : ''}
      ${s.kind === 'final' ? (has ? '<button class="btn main" id="done">Finish 🏆</button>' : '') : `<button class="btn main" id="next" ${has ? '' : 'disabled'}>Next ▶</button>`}
    </div>`;
  $('#listen').onclick = () => play(listen);
  if($('#peek')) $('#peek').onclick = () => { peek = !peek; render(); };
  if($('#back')) $('#back').onclick = () => go(at - 1);
  if($('#next')) $('#next').onclick = () => go(at + 1);
  if($('#done')) $('#done').onclick = finish;
  $('#mine').onclick = () => { stopAll(); if(recs[at]){ const a = new Audio(recs[at].url); curAudio = a; a.play(); } };
  $('#turn').onclick = () => { if(turnDone){ turnDone(); turnDone = null; } };
  $('#rec').onclick = () => {
    if(talking){ stopTalk(); return; }
    const idx = at;
    talk(talkLines, blob => {
      if(recs[idx]) URL.revokeObjectURL(recs[idx].url);
      recs[idx] = { blob, url:URL.createObjectURL(blob) };
      if(s.kind === 'final') finalRec = recs[idx];
      if(at !== idx) return stars();
      render();
      msg(['Great! ⭐', 'Nice! ⭐', 'すごい！ ⭐', 'Well done! ⭐'][idx % 4], true);
    });
  };
}
function go(i){ stopAll(); stopTalk(); at = i; peek = false; render(); if(STEPS[at] && STEPS[at].kind === 'learn') play(itemsFor([L[STEPS[at].k]])); }

function finish(){
  const c = $('#card'), r = finalRec;
  const ext = (r.blob.type.includes('mp4') ? 'm4a' : r.blob.type.includes('ogg') ? 'ogg' : 'webm');
  const done = Object.keys(recs).length;
  c.innerHTML = `<p class="big">🎉</p><h2>よくできました！</h2>
    <p style="text-align:center">You can say it all in Japanese!<br><span style="color:var(--sub)">${done} of ${STEP_COUNT} recordings done.</span></p>
    <div class="lines">${L.map(l => lineHTML(l, {})).join('')}</div>
    <div class="row"><button class="btn main" id="mine">▶ My final conversation</button></div>
    <div class="row"><a class="btn" id="save" download="my-japanese-practice.${ext}" href="${r.url}">⬇ Save my recording</a></div>
    <div class="row"><button class="btn" id="again">↺ Practise again</button></div>`;
  $('#mine').onclick = () => { stopAll(); const a = new Audio(r.url); curAudio = a; a.play(); };
  $('#again').onclick = () => { recs = {}; finalRec = null; go(0); };
}
$('#restart').onclick = () => { stopAll(); stopTalk(); at = -1; render(); };
render();
if(synth) synth.addEventListener && synth.addEventListener('voiceschanged', () => { if(at < 0 && !document.activeElement.closest('.about')) render(); });
</script>
</body>
</html>
